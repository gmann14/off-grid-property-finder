# Off-Grid Property Finder — Default Configuration
# Study area: Lunenburg region, Nova Scotia

study_area:
  name: lunenburg
  # Approximate bounding box in EPSG:2961 (NAD83(CSRS) UTM Zone 20N)
  # Covers roughly 50km x 50km around Lunenburg
  bbox: [360000, 4880000, 410000, 4930000]

cell_size_m: 250
working_crs: "EPSG:2961"

paths:
  raw: data/raw
  processed: data/processed
  output: output

# Scoring weights (must sum to 100 for enabled criteria).
# hydro = scarce, hard-to-replicate differentiator + best winter generator.
# open_ground = solar room + buildability (area-based; replaces old solar+buildable).
# access = road/civic proximity (practicality gate).
# wind = conditional winter-redundancy bonus (GWA speed at hub height, or terrain-exposure proxy).
# elevation = coastal-flood penalty only (no longer penalizes high/exposed ground).
weights:
  hydro: 40
  access: 20
  open_ground: 15
  wind: 15
  elevation: 10

enabled_criteria:
  - hydro
  - access
  - open_ground
  - wind
  - elevation

# Confidence deductions (subtracted from 100)
confidence_deductions:
  no_flood_data: 20
  hydro_drainage_proxy_only: 20
  hydro_20m_dem: 15
  incomplete_land_cover_mask: 10
  no_road_evidence_200m: 15
  wind_proxy_only: 10

# Wind resource (Global Wind Atlas). Scored as an estimated mean speed at a
# small off-grid turbine's hub height, extrapolated per pixel from the two GWA
# layers below with a power-law shear profile. 30 m = a typical small-turbine
# tower that clears ~20 m NS forest. Don't use GWA's 10 m layer: over forest it
# sits inside the canopy (~0.1–0.5 m/s), and ingest refuses a pair where the
# lower layer has collapsed like that. If you give this block, give both keys.
# Changing either invalidates data/processed/wind.tif: `ingest --force`
# rebuilds just that file.
wind:
  hub_height_m: 30
  gwa_layers:  # layer height (m) -> GWA mean wind speed COG (read by windowed /vsicurl/)
    50: https://gwa.cdn.nazkamapps.com/country_tifs_v4/CAN_wind-speed_50m.tif
    100: https://gwa.cdn.nazkamapps.com/country_tifs_v4/CAN_wind-speed_100m.tif

# Exclusion settings
exclusion_overlap_threshold: 0.5  # 50% overlap triggers hard exclusion

# Parcel settings (Stage B)
min_parcel_area_acres: 1.0  # parcels with less land than this are left unranked (0 = off)

# Optional preference criteria
# parcel_aggregation: tune how cell scores roll up to parcels (Stage B)
preferences:
  parcel_aggregation:
    top_n: 3          # parcel score = mean of top-N eligible cell scores
    cell_weight: 0.65  # weight on cell score vs. parcel-size (acreage) score
