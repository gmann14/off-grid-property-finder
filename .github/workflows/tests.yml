name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: requirements-lock.txt

      - name: Install dependencies (pinned, see requirements-lock.txt)
        run: |
          pip install -r requirements-lock.txt
          pip install -e . --no-deps

      - name: Run test suite
        run: pytest -v

      - name: Type-check CLI entrypoint smoke
        run: python -m src --help
